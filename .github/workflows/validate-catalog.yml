name: Validate Skill Catalog

on:
  pull_request:
  push:

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py

      - name: Run validator unit tests
        run: python3 -m unittest tests/test_validate_catalog.py
